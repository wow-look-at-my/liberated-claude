name: CI

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # Never name a job `all-builds`. That status is an aggregate posted by the
  # required-builds-manager app, and go-toolchain fails any run that shadows it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
